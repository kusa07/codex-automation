name: Self-hosted availability controller

on:
  workflow_call:
    inputs:
      probe_workflow:
        description: Workflow file or workflow ID for the caller-owned probe
        required: true
        type: string
      probe_ref:
        description: Ref on which the caller-owned probe workflow is dispatched
        required: true
        type: string
      availability_timeout_seconds:
        description: Maximum time to wait for probe pickup and successful completion
        required: false
        default: '120'
        type: string
      cancellation_timeout_seconds:
        description: Maximum time to wait for probe cancellation after timeout
        required: false
        default: '60'
        type: string
    outputs:
      availability:
        description: AVAILABLE, RUNNER_UNAVAILABLE, or AVAILABILITY_CHECK_FAILED
        value: ${{ jobs.check-availability.outputs.availability }}
      probe_id:
        description: Synthetic identifier passed to the caller-owned probe
        value: ${{ jobs.check-availability.outputs.probe_id }}
      probe_run_id:
        description: Dispatched probe run ID, when discovered
        value: ${{ jobs.check-availability.outputs.probe_run_id }}

# The caller may only reduce these permissions. The write permission is scoped
# to the hosted controller job below and is never passed to the self-hosted
# probe.
permissions: {}

jobs:
  check-availability:
    name: Check self-hosted runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      availability: ${{ steps.controller.outputs.availability }}
      probe_id: ${{ steps.controller.outputs.probe_id }}
      probe_run_id: ${{ steps.controller.outputs.probe_run_id }}
    steps:
      - name: Dispatch and observe credential-free probe
        id: controller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_WORKFLOW: ${{ inputs.probe_workflow }}
          PROBE_REF: ${{ inputs.probe_ref }}
          AVAILABILITY_TIMEOUT_SECONDS: ${{ inputs.availability_timeout_seconds }}
          CANCELLATION_TIMEOUT_SECONDS: ${{ inputs.cancellation_timeout_seconds }}
        run: |
          set -euo pipefail

          fail_closed() {
            printf 'availability=AVAILABILITY_CHECK_FAILED\n' >> "${GITHUB_OUTPUT}"
            printf 'probe_id=%s\n' "${PROBE_ID:-}" >> "${GITHUB_OUTPUT}"
            printf 'probe_run_id=%s\n' "${PROBE_RUN_ID:-}" >> "${GITHUB_OUTPUT}"
            exit 1
          }

          [[ "${GITHUB_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail_closed
          [[ "${PROBE_WORKFLOW}" =~ ^(([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.ya?ml|[0-9]+)$ ]] || fail_closed
          [[ "${PROBE_REF}" =~ ^[A-Za-z0-9._/-]+$ && "${PROBE_REF}" != /* && "${PROBE_REF}" != */ ]] || fail_closed
          [[ "${AVAILABILITY_TIMEOUT_SECONDS}" =~ ^[1-9][0-9]{1,3}$ ]] || fail_closed
          [[ "${CANCELLATION_TIMEOUT_SECONDS}" =~ ^[1-9][0-9]{1,3}$ ]] || fail_closed
          (( AVAILABILITY_TIMEOUT_SECONDS <= 300 )) || fail_closed
          (( CANCELLATION_TIMEOUT_SECONDS <= 180 )) || fail_closed

          # This deterministic synthetic ID is generated by the trusted hosted
          # controller and is the only probe correlation value accepted by the
          # caller workflow. It reveals neither a credential nor arbitrary
          # task content.
          PROBE_ID="$(printf '%s:%s:%s' 'ca-p10-029' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -c1-32)"
          [[ "${PROBE_ID}" =~ ^[0-9a-f]{32}$ ]] || fail_closed
          export PROBE_ID

          dispatch_started_epoch="$(date +%s)"
          payload="$(jq -cn --arg ref "${PROBE_REF}" --arg probe_id "${PROBE_ID}" \
            '{ref:$ref, inputs:{probe_id:$probe_id}}')" || fail_closed

          if ! gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${PROBE_WORKFLOW}/dispatches" \
            --input - <<<"${payload}" >/dev/null; then
            fail_closed
          fi

          find_probe_run() {
            local response
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${PROBE_WORKFLOW}/runs?event=workflow_dispatch&per_page=100")" || return 1
            # The caller-owned probe must set:
            #   run-name: Availability probe <probe_id>
            # Matching the synthetic ID prevents an unrelated concurrent
            # workflow_dispatch run from being treated as this probe.
            jq -r --arg probe_id "${PROBE_ID}" \
              '[.workflow_runs[] | select(.event == "workflow_dispatch" and .display_title == ("Availability probe " + $probe_id))] | sort_by(.created_at) | last | (.id // empty)' \
              <<<"${response}"
          }

          read_probe_run() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PROBE_RUN_ID}" \
              | jq -c '{status, conclusion}'
          }

          deadline=$((dispatch_started_epoch + AVAILABILITY_TIMEOUT_SECONDS))
          PROBE_RUN_ID=''
          while (( $(date +%s) < deadline )); do
            if [[ -z "${PROBE_RUN_ID}" ]]; then
              PROBE_RUN_ID="$(find_probe_run)" || fail_closed
            fi
            if [[ -n "${PROBE_RUN_ID}" ]]; then
              state="$(read_probe_run)" || fail_closed
              status="$(jq -r '.status' <<<"${state}")"
              conclusion="$(jq -r '.conclusion // empty' <<<"${state}")"
              if [[ "${status}" == completed ]]; then
                if [[ "${conclusion}" == success ]]; then
                  printf 'availability=AVAILABLE\nprobe_id=%s\nprobe_run_id=%s\n' "${PROBE_ID}" "${PROBE_RUN_ID}" >> "${GITHUB_OUTPUT}"
                  exit 0
                fi
                fail_closed
              fi
            fi
            sleep 15
          done

          # A timeout is only RUNNER_UNAVAILABLE after the dispatched run is
          # cancelled and observed as completed/cancelled.
          [[ -n "${PROBE_RUN_ID}" ]] || PROBE_RUN_ID="$(find_probe_run)" || fail_closed
          [[ -n "${PROBE_RUN_ID}" ]] || fail_closed
          if ! gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PROBE_RUN_ID}/cancel" >/dev/null; then
            fail_closed
          fi

          cancel_deadline=$(($(date +%s) + CANCELLATION_TIMEOUT_SECONDS))
          while (( $(date +%s) < cancel_deadline )); do
            state="$(read_probe_run)" || fail_closed
            status="$(jq -r '.status' <<<"${state}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${state}")"
            if [[ "${status}" == completed ]]; then
              if [[ "${conclusion}" == cancelled ]]; then
                printf 'availability=RUNNER_UNAVAILABLE\nprobe_id=%s\nprobe_run_id=%s\n' "${PROBE_ID}" "${PROBE_RUN_ID}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              fail_closed
            fi
            sleep 15
          done
          fail_closed
