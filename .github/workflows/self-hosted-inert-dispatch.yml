name: Self-hosted inert execution

on:
  workflow_call:

# This workflow reads only its immutable source so it can invoke the reviewed
# local execution helpers. It never checks out the caller repository and has
# no WIF, Secret Manager, Codex, or GitHub write capability.
permissions:
  contents: read

jobs:
  inert-dispatch:
    name: Credential-free inert dispatch
    runs-on: [self-hosted, Windows, X64, codex-automation]
    timeout-minutes: 10
    steps:
      - name: Check out immutable reusable workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation-source
          fetch-depth: 1
          persist-credentials: false

      - name: Run managed inert lifecycle
        shell: pwsh
        env:
          WORKFLOW_SOURCE_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SOURCE_SHA: ${{ job.workflow_sha }}
          EXECUTION_REPOSITORY_ID: ${{ github.repository_id }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
          EXECUTION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            Write-Output 'FAIL_CLOSED'
            exit 1
          }

          $sourceDirectory = Join-Path $env:GITHUB_WORKSPACE 'automation-source'
          $dispatcherScript = Join-Path $sourceDirectory 'scripts/self-hosted/run-github-inert-dispatch.sh'
          if (-not (Test-Path -LiteralPath $dispatcherScript -PathType Leaf)) {
            Write-Output 'FAIL_CLOSED'
            exit 1
          }

          & $gitBash $dispatcherScript $sourceDirectory
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
